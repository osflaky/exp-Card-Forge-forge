name: Test build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - java: '21'
          expander_leg: ubuntu-latest-21-x64
      fail-fast: false
    name: Test with Java ${{ matrix.Java }} [${{ matrix.expander_leg }}]
    steps:
    - uses: actions/checkout@v3

    - name: Setup java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'maven'

    - name: Install virtual framebuffer (if not available) to allow running GUI 
        on a headless server
      run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt 
        install -y xvfb; }

    - name: Run tests in virtual framebuffer
      run: |
        export DISPLAY=":1"
        Xvfb :1 -screen 0 800x600x8 &
        mvn -U -B clean test
    timeout-minutes: 150
